plugins {
    id "com.android.application"
}

android {
    namespace "ru.depositcalc"
    compileSdk 34

    defaultConfig {
        applicationId "ru.depositcalc"
        minSdk 26          // java.time доступен начиная с Android 8.0
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.13"
}
